# H2 em arquivo: os dados sobrevivem ao restart da aplicação
spring.datasource.url=jdbc:h2:file:./data/abastecimentos
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Console do H2 desligado por padrão (fica exposto na porta da API). Para desenvolvimento: --spring.h2.console.enabled=true
spring.h2.console.enabled=false
server.error.include-message=always
